name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          cp LICENSE cmake/LICENSE
          zip -r "cmake-${GITHUB_REF_NAME}.zip" cmake

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "cmake-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
